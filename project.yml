name: ZoiaCanvas
options:
  bundleIdPrefix: org.theashfords
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  ZoiaCanvas:
    type: application
    platform: macOS
    sources:
      - Sources/ZoiaCanvas
    # Explicit Info.plist (xcodegen writes it at generate time) so the
    # app can declare CFBundleDocumentTypes — .bin patches arrive typed
    # as com.apple.macbinary-archive, and claiming that type is what
    # makes Finder double-click, Dock drops, and `open -a` deliver the
    # file to the app.
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconFile: ZoiaCanvas
        # Live play-through taps the input device; macOS requires a usage
        # string before granting microphone access. The target is not
        # sandboxed (no entitlements configured), so no
        # com.apple.security.device.audio-input entitlement is needed.
        NSMicrophoneUsageDescription: "ZoiaCanvas routes live audio input through your patch's Audio Input modules."
        CFBundleDocumentTypes:
          - CFBundleTypeName: ZOIA Patch
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.macbinary-archive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.theashfords.ZoiaCanvas
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: complete
  ZoiaCanvasTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ZoiaCanvasTests
        excludes:
          - "Corpus/**"
      - path: Tests/ZoiaCanvasTests/Corpus
        type: folder
        buildPhase: resources
    dependencies:
      - target: ZoiaCanvas
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ZoiaCanvas.app/Contents/MacOS/ZoiaCanvas"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ZoiaCanvas:
    build:
      targets:
        ZoiaCanvas: all
        ZoiaCanvasTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZoiaCanvasTests
